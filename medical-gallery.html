<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Medical Mission Gallery</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css" rel="stylesheet">
</head>
<body>
  <section class="gallery">
    <h1>Medical Mission – Full Gallery</h1>
    <div class="gallery-grid" id="medical-gallery"></div>
  </section>

  <script>
    const medicalImages = [
      "mission1.jpg","mission2.jpg","mission3.jpg","mission4.jpg","mission5.jpg"
    ];
    const container = document.getElementById("medical-gallery");
    medicalImages.forEach(img => {
      container.innerHTML += `
        <a href="images/medical-mission/${img}" data-lightbox="medical">
          <img src="images/medical-mission/${img}" alt="${img}">
        </a>`;
    });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox.min.js"></script>
</body>
</html>
