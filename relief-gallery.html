<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Relief Operation Gallery</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css" rel="stylesheet">
</head>
<body>
  <section class="gallery">
    <h1>Relief Operation – Full Gallery</h1>
    <div class="gallery-grid" id="relief-gallery"></div>
  </section>

  <script>
    const reliefImages = [
      "relief1.jpg","relief2.jpg","relief3.jpg","relief4.jpg","relief5.jpg"
    ];
    const reliefContainer = document.getElementById("relief-gallery");
    reliefImages.forEach(img => {
      reliefContainer.innerHTML += `
        <a href="images/relief-operation/${img}" data-lightbox="relief">
          <img src="images/relief-operation/${img}" alt="${img}">
        </a>`;
    });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox.min.js"></script>
</body>
</html>
